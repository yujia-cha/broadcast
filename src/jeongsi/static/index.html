<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>정시 방송</title>
<link rel="stylesheet" href="/static/app.css">
<script type="module" src="/static/app.js"></script>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <span class="brand">정시 방송<span class="livepill" id="livepill" hidden><span class="dot"></span><span id="livepill-text">방송 중</span></span></span>
    <nav class="nav" aria-label="메뉴">
      <button data-view="timetable">시간표</button>
      <button data-view="programs">방송 구성</button>
      <button data-view="history">기록</button>
      <button data-view="settings">설정</button>
    </nav>
    <span class="grow"></span>
    <button class="btn sm accent" id="update-btn" hidden></button>
    <span class="auto" id="auto-label">자동 방송<button class="switch" id="auto-switch" role="switch" aria-checked="true" aria-labelledby="auto-label"></button></span>
  </header>
  <div class="banners" id="banners"></div>
  <main class="view" id="view"><div class="loading">불러오는 중…</div></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
