name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 의존성 설치 (Linux)
        if: runner.os == 'Linux'
        run: pip install ".[dev]"
      - name: 의존성 설치 (Windows)
        if: runner.os == 'Windows'
        run: pip install ".[dev,windows]"
      - name: 테스트 (Windows는 실제 오디오 통합 테스트 포함)
        run: python -m pytest -q -rs -s
