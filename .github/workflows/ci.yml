name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 의존성 설치 (Linux)
        if: runner.os == 'Linux'
        run: pip install ".[dev]"
      - name: 의존성 설치 (Windows)
        if: runner.os == 'Windows'
        run: pip install ".[dev,windows]"
      - name: 테스트 (Windows는 실제 오디오 통합 테스트 포함)
        run: python -m pytest -q -rs -s

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 의존성 설치
        run: |
          pip install ".[dev]"
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: 화면 E2E
        run: python tests/e2e/run_e2e.py e2e-screenshots
      - name: 스크린샷 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e-screenshots
          retention-days: 7

  # 브랜치 푸시마다 exe 빌드와 배포 스모크 테스트(태그 릴리즈에서는 Release가 따로 부른다)
  package:
    needs: test
    if: github.ref_type == 'branch'
    uses: ./.github/workflows/package.yml
